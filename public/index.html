<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taksit & Tahsilat Asistanı</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --whatsapp: #25d366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; }
    header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 1.5rem; color: var(--primary); }
    .status-badge { display: inline-block; font-size: 0.75rem; padding: 4px 8px; border-radius: 9999px; background: rgba(34, 197, 94, 0.2); color: var(--success); margin-top: 6px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0b1329; color: var(--text); font-size: 0.95rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .input-btn-group { display: flex; gap: 6px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
    .btn-primary { background: var(--primary); color: #000; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ocr { background: #3b82f6; color: #fff; margin-bottom: 12px; }
    .btn-contact { background: #6366f1; color: #fff; width: auto; padding: 0 12px; font-size: 0.85rem; white-space: nowrap; }
    .btn-whatsapp { background: var(--whatsapp); color: #000; padding: 6px 10px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 4px; border: none; cursor: pointer; }
    .file-label-btn { cursor: pointer; text-align: center; }
    .ocr-loading { display: none; text-align: center; font-size: 0.85rem; color: var(--primary); margin-bottom: 12px; }
    .item-card { background: #131d33; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .item-title { font-weight: 600; font-size: 1rem; }
    .item-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .item-badge { background: #0284c7; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-right: 6px; }
    .actions { display: flex; align-items: center; gap: 6px; }
    .btn-delete { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Taksit & Tahsilat Asistanı</h1>
    <div id="status" class="status-badge">Veritabanı Aktif</div>
  </header>

  <div class="card">
    <input type="file" id="receiptFileInput" accept="image/*" style="display: none;" onchange="processReceipt(event)">
    <label for="receiptFileInput" class="btn btn-ocr file-label-btn">
      📷 Fiş / Makbuz Tara (Kamera / Galeri)
    </label>
    <div id="ocrStatus" class="ocr-loading">Fiş taranıyor, metinler okunuyor...</div>

    <form id="installmentForm" onsubmit="saveInstallment(event)">
      <div class="form-group">
        <label>Kişi / Borçlu Adı</label>
        <div class="input-btn-group">
          <input type="text" id="person" required placeholder="Örn: Ahmet Yılmaz">
          <button type="button" id="btnPickContact" class="btn btn-contact" onclick="pickContact()" title="Rehberden Seç">
            📇 Rehberden Al
          </button>
        </div>
      </div>
      
      <div class="grid-2">
        <div class="form-group">
          <label>Telefon</label>
          <input type="tel" id="phone" placeholder="05xx xxx xx xx">
        </div>
        <div class="form-group">
          <label>Platform / Yer</label>
          <select id="platform">
            <option value="Trendyol">Trendyol</option>
            <option value="Hepsiburada">Hepsiburada</option>
            <option value="Elden">Elden Satış</option>
            <option value="Diğer">Diğer</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Açıklama / Ürün Başlığı</label>
        <input type="text" id="title" required placeholder="Örn: Telefon / Mobilya">
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Toplam Tutar (TL)</label>
          <input type="number" id="totalAmount" required step="0.01" placeholder="0.00">
        </div>
        <div class="form-group">
          <label>Taksit Sayısı</label>
          <input type="number" id="totalInstallments" required value="3" min="1">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Ödeme Günü (Ayın)</label>
          <input type="number" id="paymentDay" required min="1" max="31" value="1">
        </div>
        <div class="form-group">
          <label>Başlangıç Tarihi</label>
          <input type="date" id="startDate" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Taksiti Kaydet</button>
    </form>
  </div>

  <h2>Kayıtlı Taksitler</h2>
  <div id="listContainer" style="margin-top: 12px;"></div>
</div>

<script>
  document.getElementById('startDate').value = new Date().toISOString().split('T')[0];

  // Rehber desteği kontrolü (Desteklenmeyen tarayıcılarda butonu gizler)
  if (!('contacts' in navigator && 'ContactsManager' in window)) {
    const contactBtn = document.getElementById('btnPickContact');
    if (contactBtn) contactBtn.style.display = 'none';
  }

  // 1. Telefondan Rehberi Açıp Kişi ve Numara Çekme
  async function pickContact() {
    try {
      const props = ['name', 'tel'];
      const contacts = await navigator.contacts.select(props, { multiple: false });
      
      if (contacts && contacts.length > 0) {
        const contact = contacts[0];
        if (contact.name && contact.name.length > 0) {
          document.getElementById('person').value = contact.name[0];
        }
        if (contact.tel && contact.tel.length > 0) {
          let cleanPhone = contact.tel[0].replace(/\s+/g, '').replace(/-/g, '');
          document.getElementById('phone').value = cleanPhone;
        }
      }
    } catch (err) {
      console.log('Rehber seçimi iptal edildi veya desteklenmiyor:', err);
    }
  }

  // 2. WhatsApp Mesajını Uygulama Olarak Açma
  function sendToWhatsApp(phone, person, title, amount, day) {
    if (!phone) {
      alert('Kayıtlı bir telefon numarası bulunamadı!');
      return;
    }

    // Numarayı uluslararası formata uyarla (Başında 0 varsa 90 ekle)
    let clean = phone.replace(/[^0-9]/g, '');
    if (clean.startsWith('0')) clean = '90' + clean.substring(1);
    if (!clean.startsWith('90')) clean = '90' + clean;

    const message = `Merhaba ${person}, ${title} alışverişine ait taksit ödemen yaklaşıyor.\nTutar: ${amount} TL\nÖdeme Günü: Ayın ${day}. günü.\nBilginize sunarız.`;
    const encoded = encodeURIComponent(message);

    // Sayfayı bozmadan doğrudan WhatsApp uygulamasını tetikleyen güvenli link
    const waUrl = `https://api.whatsapp.com/send?phone=${clean}&text=${encoded}`;
    window.open(waUrl, '_blank');
  }

  // 3. Taksitleri Listele
  async function loadInstallments() {
    try {
      const res = await fetch('/api/installments');
      const data = await res.json();
      const container = document.getElementById('listContainer');
      container.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 20px;">Henüz taksit kaydı yok.</p>';
        return;
      }

      data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-card';
        const total = item.totalamount || item.totalAmount || 0;
        const paid = item.paidinstallments || item.paidInstallments || 0;
        const count = item.totalinstallments || item.totalInstallments || 1;
        const day = item.paymentday || item.paymentDay || 1;

        div.innerHTML = `
          <div>
            <div class="item-title"><span class="item-badge">${item.platform || 'Genel'}</span>${item.person} - ${item.title}</div>
            <div class="item-sub">Tutar: ${total} TL | Taksit: ${paid}/${count} | Gün: Ayın ${day}'i</div>
            ${item.phone ? `<div class="item-sub" style="color: #38bdf8;">📞 ${item.phone}</div>` : ''}
          </div>
          <div class="actions">
            <button class="btn-whatsapp" onclick="sendToWhatsApp('${item.phone || ''}', '${item.person}', '${item.title}', '${total}', '${day}')">
              💬 WP
            </button>
            <button class="btn-delete" onclick="deleteInstallment('${item.id}')">Sil</button>
          </div>
        `;
        container.appendChild(div);
      });
    } catch (err) {
      console.error('Listeleme hatası:', err);
    }
  }

  // 4. Yeni Taksit Kaydet
  async function saveInstallment(e) {
    e.preventDefault();
    const payload = {
      id: 'inst_' + Date.now(),
      person: document.getElementById('person').value,
      phone: document.getElementById('phone').value,
      platform: document.getElementById('platform').value,
      title: document.getElementById('title').value,
      totalAmount: parseFloat(document.getElementById('totalAmount').value),
      totalInstallments: parseInt(document.getElementById('totalInstallments').value),
      paidInstallments: 0,
      paymentDay: parseInt(document.getElementById('paymentDay').value),
      startDate: document.getElementById('startDate').value,
      history: []
    };

    try {
      const res = await fetch('/api/installments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        document.getElementById('installmentForm').reset();
        document.getElementById('startDate').value = new Date().toISOString().split('T')[0];
        loadInstallments();
      }
    } catch (err) {
      alert('Kaydedilirken hata oluştu!');
    }
  }

  // 5. Taksit Sil
  async function deleteInstallment(id) {
    if (!confirm('Bu taksiti silmek istediğine emin misin?')) return;
    try {
      const res = await fetch(`/api/installments/${id}`, { method: 'DELETE' });
      if (res.ok) loadInstallments();
    } catch (err) {
      alert('Silme hatası!');
    }
  }

  // 6. Mobilde Fiş Okuma
  async function processReceipt(event) {
    const file = event.target.files[0];
    if (!file) return;

    const ocrStatus = document.getElementById('ocrStatus');
    ocrStatus.style.display = 'block';

    try {
      const { data: { text } } = await Tesseract.recognize(file, 'tur', {
        logger: m => {
          if (m.status === 'recognizing text') {
            ocrStatus.innerText = `Fiş taranıyor: %${Math.round(m.progress * 100)}`;
          }
        }
      });

      ocrStatus.innerText = 'Bilgiler çıkarılıyor...';
      const matches = text.match(/\d+[\.,]\d{2}/g);
      if (matches && matches.length > 0) {
        const lastNumber = matches[matches.length - 1].replace(',', '.');
        document.getElementById('totalAmount').value = parseFloat(lastNumber);
      }
      
      document.getElementById('title').value = 'Fiş: ' + text.slice(0, 18).trim();
      ocrStatus.style.display = 'none';
      alert('Fiş tarandı ve tutar kutucuğa aktarıldı!');
    } catch (err) {
      console.error(err);
      ocrStatus.style.display = 'none';
      alert('Fiş okunamadı, bilgileri elle girebilirsin.');
    }
  }

  loadInstallments();
</script>
</body>
</html>
